version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: food_delivery_backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/biterush
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
    container_name: food_delivery_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  admin:
    build:
      context: ./admin
    container_name: food_delivery_admin
    ports:
      - "5174:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules

  mongo:
    image: mongo:latest
    container_name: food_delivery_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
